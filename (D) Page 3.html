<!DOCTYPE html>
<html>
    <body>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #f9f9f9;
        }
        .circle {
            width: 80px;
            height: 80px;
            background-color: #4CAF50;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
        }
        .checkmark {
            color: white;
            font-size: 50px;
            font-weight: bold;
        }
        p {
            font-size: 1.2rem;
            color: #333;
        }
    </style>
</head>
<body>

    <div class="circle">
        <div class="checkmark">✓</div>
    </div>
    <p>Your message has been sent</p>

</body>
</html>
